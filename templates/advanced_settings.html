{% extends "base.html" %}{% block content %}<nav aria-label="breadcrumb"><ol class="breadcrumb"><li class="breadcrumb-item"><a href="/settings">Settings</a></li><li class="breadcrumb-item active">Advanced</li></ol></nav><h1 class="h3">Advanced Settings</h1><form method="post" action="/settings/advanced"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><div class="card mb-3"><div class="card-header">LDAP panel authentication</div><div class="card-body"><div class="form-check mb-3"><input class="form-check-input" type="checkbox" name="ldap_login_enabled" id="ldap-login-enabled" {% if ldap_login_enabled %}checked{% endif %}><label class="form-check-label" for="ldap-login-enabled">Enable LDAP login to panel</label></div><label class="form-label">Default role for LDAP users</label><select class="form-select" name="ldap_default_role"><option {{ 'selected' if ldap_default_role == 'Read Only' }}>Read Only</option><option {{ 'selected' if ldap_default_role == 'Operator' }}>Operator</option><option {{ 'selected' if ldap_default_role == 'Administrator' }}>Administrator</option></select></div></div><div class="card mb-3"><div class="card-header">Attribute mapping</div><div class="card-body"><textarea class="form-control font-monospace" rows="10" name="mapping_json" required>{{ mapping_json }}</textarea></div></div><div class="card mb-3"><div class="card-header">ObjectClass templates</div><div class="card-body"><textarea class="form-control font-monospace" rows="16" name="templates_json" required>{{ templates_json }}</textarea></div></div><button class="btn btn-primary">Save advanced settings</button></form>{% endblock %}
