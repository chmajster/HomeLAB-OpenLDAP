{% extends "base.html" %}{% block content %}<nav aria-label="breadcrumb"><ol class="breadcrumb"><li class="breadcrumb-item">Administration</li><li class="breadcrumb-item active">Logs</li></ol></nav><h1 class="h3">Logs</h1><form class="row g-2 mb-3"><div class="col-auto"><select class="form-select" name="source"><option value="application" {{ 'selected' if source == 'application' }}>Application</option><option value="ldap" {{ 'selected' if source == 'ldap' }}>LDAP</option></select></div><div class="col-auto"><input class="form-control" type="number" min="1" max="1000" name="lines" value="{{ lines }}"></div><div class="col-auto"><button class="btn btn-primary">Refresh</button></div></form><div class="card"><div class="card-body"><pre class="log-view mb-0">{{ content }}</pre></div></div>{% endblock %}
