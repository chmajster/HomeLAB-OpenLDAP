{% extends "base.html" %}{% block content %}<nav aria-label="breadcrumb"><ol class="breadcrumb"><li class="breadcrumb-item"><a href="/directory">Directory</a></li><li class="breadcrumb-item active">Groups</li></ol></nav><h1 class="h3 mb-4">Groups</h1><div class="card"><div class="table-responsive"><table class="table table-hover mb-0"><thead><tr><th>Group Name</th><th>GID</th><th>Members</th><th>DN</th></tr></thead><tbody>{% for g in groups %}<tr><td><a href="/groups/{{ g.cn[0] if g.cn is iterable and g.cn is not string else g.cn }}">{{ g.cn }}</a></td><td>{{ g.gidNumber or '' }}</td><td>{{ (g.member or g.uniqueMember or g.memberUid or [])|length }}</td><td class="small dn-cell">{{ g.dn }}</td></tr>{% else %}<tr><td colspan="4" class="text-secondary">Brak grup.</td></tr>{% endfor %}</tbody></table></div></div>{% endblock %}
