{% extends "base.html" %}{% block content %}<nav aria-label="breadcrumb"><ol class="breadcrumb"><li class="breadcrumb-item">Tools</li><li class="breadcrumb-item active">Backups</li></ol></nav><div class="d-flex justify-content-between align-items-center"><h1 class="h3">Backups</h1><form method="post" action="/backups/create"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><button class="btn btn-primary">Create backup</button></form></div><div class="card mt-3"><div class="table-responsive"><table class="table table-hover mb-0"><thead><tr><th>Filename</th><th>Date</th><th>Size</th><th>Actions</th></tr></thead><tbody>{% for b in backups %}<tr><td><code>{{ b.filename }}</code></td><td>{{ b.modified }}</td><td>{{ b.size }}</td><td><details><summary class="btn btn-sm btn-outline-danger">Danger zone</summary><form method="post" action="/backups/restore" class="mt-2"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><input type="hidden" name="filename" value="{{ b.filename }}"><input class="form-control form-control-sm" name="confirmation" placeholder="RESTORE {{ b.filename }}" required><button class="btn btn-sm btn-danger mt-1">Restore</button></form><form method="post" action="/backups/delete" class="mt-2"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><input type="hidden" name="filename" value="{{ b.filename }}"><input class="form-control form-control-sm" name="confirmation" placeholder="DELETE {{ b.filename }}" required><button class="btn btn-sm btn-outline-danger mt-1">Delete</button></form></details></td></tr>{% else %}<tr><td colspan="4">Brak backupów.</td></tr>{% endfor %}</tbody></table></div></div>{% endblock %}
