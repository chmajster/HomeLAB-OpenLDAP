{% extends "base.html" %}{% block content %}<nav aria-label="breadcrumb"><ol class="breadcrumb"><li class="breadcrumb-item">Directory</li><li class="breadcrumb-item active">Search</li></ol></nav><h1 class="h3">LDAP Search</h1><form class="card card-body mb-4"><div class="row g-3"><div class="col-md-6"><label class="form-label">Base DN</label><input class="form-control" name="base_dn" value="{{ base_dn }}"></div><div class="col-md-6"><label class="form-label">LDAP Filter</label><input class="form-control font-monospace" name="ldap_filter" value="{{ ldap_filter }}"></div></div><button class="btn btn-primary mt-3 align-self-start">Search</button></form><div class="card"><div class="card-header">Results: {{ results|length }}</div><div class="table-responsive"><table class="table table-sm table-hover mb-0"><thead><tr><th>DN</th><th>Attributes</th></tr></thead><tbody>{% for r in results %}<tr><td class="text-break">{{ r.dn }}</td><td><pre class="small mb-0">{{ r }}</pre></td></tr>{% endfor %}</tbody></table></div></div>{% endblock %}
