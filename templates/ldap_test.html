{% extends "base.html" %}{% block content %}<nav aria-label="breadcrumb"><ol class="breadcrumb"><li class="breadcrumb-item">Tools</li><li class="breadcrumb-item active">LDAP Test</li></ol></nav><div class="d-flex justify-content-between"><h1 class="h3">LDAP Test</h1><a class="btn btn-outline-primary" href="/ldap-test">Run again</a></div><div class="card mt-3"><div class="card-header">{{ ldap.url }} · {{ ldap.base_dn }}</div><div class="card-body">{% for s in steps %}<div class="d-flex gap-2 border-bottom py-2"><span class="badge {{ 'text-bg-success' if s.ok else 'text-bg-danger' }}">{{ 'OK' if s.ok else 'FAIL' }}</span><strong>{{ s.name }}</strong><span>{{ s.detail }}</span>{% if s.duration_ms %}<span class="ms-auto">{{ s.duration_ms }} ms</span>{% endif %}</div>{% endfor %}</div></div>{% endblock %}
