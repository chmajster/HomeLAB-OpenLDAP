name: Security
on:
  push:
  pull_request:
  schedule:
    - cron: '17 4 * * 1'
jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements.txt
      - name: Bandit
        run: bandit -r app -x tests -q -s B324
      - name: Dependency audit
        run: pip-audit -r requirements.txt
