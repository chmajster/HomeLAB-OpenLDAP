[tool.ruff]
target-version = "py311"
line-length = 140
exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "B"]
ignore = ["B008", "E501", "F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.coverage.run]
source = ["app"]
omit = ["migrations/*"]
